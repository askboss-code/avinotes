<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18233b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>AviNotes</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#1d2940;--muted:#71809a;--line:#e4e9f2;--accent:#526de5;--soft:#eef1ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,sans-serif}
header{background:#18233b;color:white;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.7px}.sub{font-size:12px;color:#b9c5df}
button,.filebtn{border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:white;font-weight:650;font-size:14px;cursor:pointer}
button.secondary,.filebtn{background:var(--soft);color:#3549a4}button.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
main{max-width:1100px;margin:auto;padding:18px;display:grid;grid-template-columns:290px 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;min-width:0}
h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}
.search{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;margin-bottom:12px;font:inherit}
.note-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}.note-item{text-align:left;background:#f7f8fc;color:var(--ink);border:1px solid transparent;padding:11px;border-radius:12px}
.note-item.active{border-color:#9ba9f4;background:#f0f2ff}.note-item strong{display:block}.note-item small{color:var(--muted)}
.editor-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}.title{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px;font:600 16px system-ui}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.toolbar button{padding:8px 11px}.toolbar input[type=color]{width:38px;height:36px;border:0;background:transparent}
textarea{width:100%;min-height:145px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:13px;font:15px/1.55 system-ui;color:var(--ink);outline-color:#9ba9f4}
.canvas-wrap{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:white;touch-action:none}
canvas{display:block;width:100%;height:310px;touch-action:none;cursor:crosshair}
.status{font-size:12px;color:var(--muted);margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#empty{padding:45px 15px;text-align:center;color:var(--muted)}
@media(max-width:760px){main{grid-template-columns:1fr;padding:11px}.note-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:12px}canvas{height:260px}header{padding:14px}}
</style>
</head>
<body>
<header><div><div class="brand">✦ AviNotes</div><div class="sub">Your personal study space</div></div><button id="newBtn">＋ New note</button></header>
<main>
<section class="panel">
<h2>My notebooks</h2>
<input id="search" class="search" placeholder="Search notes…">
<div class="muted">All notes are saved on this device.</div>
<div id="notes" class="note-list"></div>
<div class="actions"><button class="secondary" id="exportBtn">Export backup</button><label class="filebtn">Import backup<input id="importFile" type="file" accept="application/json" hidden></label></div>
</section>
<section class="panel">
<div id="editor">
<div class="editor-head"><input id="noteTitle" class="title" placeholder="Untitled note"><button class="secondary" id="deleteBtn">Delete</button></div>
<textarea id="noteText" placeholder="Type your notes here…"></textarea>
<h2 style="margin-top:16px">Handwriting & drawing</h2>
<div class="toolbar">
<button id="penBtn">✎ Pen</button><button class="secondary" id="eraserBtn">⌫ Eraser</button>
<label class="muted" style="display:flex;align-items:center;gap:5px">Color <input id="color" type="color" value="#24324d"></label>
<label class="muted" style="display:flex;align-items:center;gap:5px">Size <input id="size" type="range" min="1" max="16" value="3"></label>
<button class="secondary" id="undoBtn">Undo</button><button class="secondary" id="clearBtn">Clear</button>
</div>
<div class="canvas-wrap"><canvas id="pad"></canvas></div>
<div class="status" id="status">Ready · Changes save automatically on this device.</div>
<div class="actions"><button id="saveBtn">Save note</button><button class="secondary" id="newPageBtn">New blank note</button></div>
</div>
<div id="empty" hidden><h2>Welcome to AviNotes</h2><p>Create your first note and start studying.</p><button id="firstBtn">＋ Create first note</button></div>
</section>
</main>
<script>
const DB='avinotes_db', STORE='notes'; let db, current=null, drawing=false, mode='pen', history=[];
const $=id=>document.getElementById(id), canvas=$('pad'), ctx=canvas.getContext('2d');
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>b.updated-a.updated));r.onerror=()=>rej(r.error)})}
function put(n){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(n);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function del(id){return new Promise((res,rej)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function resizeCanvas(){let old=canvas.toDataURL();let dpr=Math.max(1,window.devicePixelRatio||1),w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';if(current?.drawing){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,w,h);im.src=current.drawing}}
function snapshot(){history.push(canvas.toDataURL());if(history.length>20)history.shift()}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
async function refresh(){let q=$('search').value.toLowerCase(),items=await all();$('notes').innerHTML='';items.filter(n=>(n.title+' '+n.text).toLowerCase().includes(q)).forEach(n=>{let b=document.createElement('button');b.className='note-item'+(current?.id===n.id?' active':'');b.innerHTML='<strong></strong><small></small>';b.querySelector('strong').textContent=n.title||'Untitled note';b.querySelector('small').textContent=new Date(n.updated).toLocaleString();b.onclick=()=>load(n);$('notes').append(b)});$('empty').hidden=items.length>0;$('editor').hidden=items.length===0&&!current}
async function save(){if(!current)current={id:newId(),created:Date.now()};current.title=$('noteTitle').value.trim()||'Untitled note';current.text=$('noteText').value;current.drawing=canvas.toDataURL('image/png');current.updated=Date.now();await put(current);$('status').textContent='Saved locally · '+new Date().toLocaleTimeString();await refresh()}
async function load(n){current=n;$('noteTitle').value=n.title||'';$('noteText').value=n.text||'';history=[];resizeCanvas();if(n.drawing){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight);im.src=n.drawing}await refresh()}
function create(){current={id:newId(),created:Date.now()};$('noteTitle').value='';$('noteText').value='';ctx.clearRect(0,0,canvas.width,canvas.height);history=[];$('editor').hidden=false;$('empty').hidden=true;refresh()}
function point(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);snapshot();drawing=true;let p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.strokeStyle=mode==='eraser'?'#ffffff':$('color').value;ctx.lineWidth=mode==='eraser'?Math.max(12,+$('size').value*4):+$('size').value;ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke()});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let p=point(e);ctx.strokeStyle=mode==='eraser'?'#ffffff':$('color').value;ctx.lineWidth=mode==='eraser'?Math.max(12,+$('size').value*4):+$('size').value;ctx.lineTo(p.x,p.y);ctx.stroke()});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,()=>{if(drawing){drawing=false;save()}}));
$('newBtn').onclick=create;$('firstBtn').onclick=create;$('newPageBtn').onclick=create;$('saveBtn').onclick=save;$('search').oninput=refresh;
$('penBtn').onclick=()=>mode='pen';$('eraserBtn').onclick=()=>mode='eraser';
$('undoBtn').onclick=()=>{let d=history.pop();if(d){let im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight);save()};im.src=d}};
$('clearBtn').onclick=()=>{snapshot();ctx.clearRect(0,0,canvas.width,canvas.height);save()};
$('deleteBtn').onclick=async()=>{if(current&&confirm('Delete this note?')){await del(current.id);current=null;create();await refresh()}};
$('exportBtn').onclick=async()=>{let blob=new Blob([JSON.stringify(await all())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='avinotes-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let arr=JSON.parse(await f.text());for(let n of arr)if(n.id)await put(n);await refresh();alert('Backup imported.')}catch{alert('Invalid backup file.')}e.target.value=''};
(async()=>{db=await openDB();resizeCanvas();let items=await all();if(items.length)await load(items[0]);else{create();await refresh()}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
window.addEventListener('resize',()=>{if(current)resizeCanvas()});
</script>
</body></html>
